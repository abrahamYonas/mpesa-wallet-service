spring.application.name=mpesa-spring
server.port=${PORT:8081}
server.tomcat.threads.max=50

spring.datasource.url=jdbc:postgresql://localhost:5433/mpesa_spring
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=2000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# bank posts callbacks here (pick one at random; duplicates use same event_id)
mpesa.callback.urls=http://localhost:8081/mpesa/v1/callbacks/bank,http://localhost:8082/mpesa/v1/callbacks/bank
